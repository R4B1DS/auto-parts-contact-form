<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #5F7C8A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lucida Sans', 'Lucida Grande', Geneva, Verdana, sans-serif;
        }

        form {
            background-color: white;
            max-width: 500px;
            width: 90%;
            padding: 20px;
        }

        form h3 {
            text-align: center;
            color: #5F7C8A;
            margin-bottom: 10px;
        }

        form label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }

        form input[type=email],
        form input[type=tel] {
            width: 100%;
            height: 45px;
            border: 1px solid #ccc;
            padding-left: 10px;
            margin: 6px 0 10px;
        }

        form input:focus {
            outline: 2px solid #5F7C8A;
            outline-offset: 1px;
            border-color: #5F7C8A;
        }

        form input[type=submit] {
            width: 100%;
            height: 40px;
            cursor: pointer;
            background: #5F7C8A;
            color: white;
            border: 0;
            border-radius: 20px;
            transition: background-color 0.3s;
        }

        form input[type=submit]:hover {
            background-color: #4A5F6A;
        }
    </style>
</head>
<body>
    <!-- Troque "/contato" pela rota do seu backend -->
    <form action="/contato" method="post">
        <h3>Entrar em Contato</h3>

        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" placeholder="seu e-mail..." autocomplete="email" required>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" name="telefone" placeholder="telefone para contato..." autocomplete="tel" required>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
